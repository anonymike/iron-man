kind = "web"
previewPath = "/"
title = "Stark Industries — Mark LXXXV"
description = "An Iron Man / Stark Industries fan-art landing page featuring scroll-animated frame sequences of the Iron Man suits, cinematic quote reveals, a HUD-styled systems readout, smooth scrolling, and a dark gold-accented aesthetic. Built for fans who want to experience the Mark LXXXV story in an immersive web format."
version = "1.0.0"
id = "artifacts/iron-man"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25791

[services.development]
run = "pnpm --filter @workspace/iron-man run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iron-man", "run", "build" ]
serve = "static"
publicDir = "artifacts/iron-man/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25791"
BASE_PATH = "/"
